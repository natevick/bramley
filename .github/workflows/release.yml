name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/package-release.sh --check-tag "$TAG"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p bramley
      - name: Check shipped features
        run: scripts/check-shipped-features.sh "target/$TARGET/release/bramley"
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/package-release.sh "$TAG" "target/$TARGET/release/bramley" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Verify the checksum
        working-directory: dist
        run: sha256sum --check ./*.sha256
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes dist/*
