[package]
name = "cdm-host-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
pulseaudio = "0.3.1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
ureq = "3"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
