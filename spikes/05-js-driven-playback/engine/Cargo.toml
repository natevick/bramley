[package]
name = "spike5-engine"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
pulseaudio = "0.3.1"
rquickjs = "0.14"
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
ureq = "3"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
