[package]
name = "bramley-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
bramley-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"

[features]
loopback = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bramley_tokens)"] }

[dev-dependencies]
flate2 = "1"
