[package]
name = "bramley"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
bramley-engine = { path = "../engine" }
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11"] }
egui = "0.36.1"
fastframe-fonts = { git = "https://github.com/crmne/fastframe", rev = "23d87e048185ef317f272e2a67416f516b2f2b04" }
fastframe-log = { git = "https://github.com/crmne/fastframe", rev = "23d87e048185ef317f272e2a67416f516b2f2b04" }
fastframe-instance = { git = "https://github.com/crmne/fastframe", rev = "23d87e048185ef317f272e2a67416f516b2f2b04" }
fastframe-text = { git = "https://github.com/crmne/fastframe", rev = "23d87e048185ef317f272e2a67416f516b2f2b04" }
png = "0.18"
serde_json = "1"

[features]
dev = []
