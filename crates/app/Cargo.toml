[package]
name = "bramley"
version = "0.6.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
bramley-api = { path = "../api" }
bramley-engine = { path = "../engine", default-features = false }
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11"] }
egui = "0.36.1"
fastframe-fonts = { git = "https://github.com/crmne/fastframe", rev = "4cf12984fca3ade655b214add154828684e3e993" }
fastframe-log = { git = "https://github.com/crmne/fastframe", rev = "4cf12984fca3ade655b214add154828684e3e993" }
fastframe-instance = { git = "https://github.com/crmne/fastframe", rev = "4cf12984fca3ade655b214add154828684e3e993" }
fastframe-text = { git = "https://github.com/crmne/fastframe", rev = "4cf12984fca3ade655b214add154828684e3e993" }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
keyring-core = "1"
log = "0.4"
png = { version = "0.18", optional = true }
# Official MCP SDK for `bramley mcp`: server + stdio transport only; enabling an HTTP transport feature would add a network listener.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
# rmcp is async; a current-thread runtime is all `bramley mcp` starts.
tokio = { version = "1", default-features = false, features = ["rt"] }
ureq = "3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
bramley-engine = { path = "../engine" }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
bramley-macos-player = { path = "../macos-player" }
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[features]
dev = ["dep:png", "bramley-api/loopback"]
gate-sabotage = []
trace = ["bramley-engine/trace"]

