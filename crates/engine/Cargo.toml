[package]
name = "bramley-engine"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "Playback engine that runs Apple's MusicKit JS in an embedded JavaScript runtime with native media and Widevine DRM host objects."
repository = "https://github.com/natevick/bramley"
homepage = "https://github.com/natevick/bramley"
readme = "README.md"
keywords = ["apple-music", "musickit", "widevine", "eme", "quickjs"]
categories = ["multimedia::audio"]
include = [
    "/src/*.rs",
    "/src/shim.cc",
    "/js/*.js",
    "/cdm-api/*",
    "/build.rs",
    "/README.md",
    "/LICENSE",
]

[dependencies]
anyhow = { version = "1", optional = true }
getrandom = { version = "0.2", optional = true }
pulseaudio = { version = "0.3.1", optional = true }
rquickjs = { version = "0.14", optional = true }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["aac"], optional = true }
ureq = { version = "3", optional = true }

[features]
default = ["runtime"]
runtime = ["dep:anyhow", "dep:getrandom", "dep:pulseaudio", "dep:rquickjs", "dep:sha2", "dep:symphonia", "dep:ureq"]
sabotage = ["runtime"]
diagnostics = []
trace = ["runtime"]

[[bin]]
name = "bramley-musickit"
path = "src/bin/bramley-musickit/main.rs"
required-features = ["sabotage", "diagnostics"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[build-dependencies]
cc = "1"
