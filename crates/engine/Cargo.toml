[package]
name = "bramley-engine"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Playback engine that runs Apple's MusicKit JS in an embedded JavaScript runtime with native media and Widevine DRM host objects."
repository = "https://github.com/natevick/bramley"
homepage = "https://github.com/natevick/bramley"
readme = "README.md"
keywords = ["apple-music", "musickit", "widevine", "eme", "quickjs"]
categories = ["multimedia::audio"]
include = [
    "/src/*.rs",
    "/src/shim.cc",
    "/js/*.js",
    "/cdm-api/*",
    "/build.rs",
    "/README.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1"
getrandom = "0.2"
pulseaudio = "0.3.1"
rquickjs = "0.14"
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
ureq = "3"

[features]
sabotage = []
diagnostics = []
trace = []

[[bin]]
name = "bramley-musickit"
path = "src/bin/bramley-musickit/main.rs"
required-features = ["sabotage", "diagnostics"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[build-dependencies]
cc = "1"
