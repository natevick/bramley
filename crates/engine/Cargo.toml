[package]
name = "bramley-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
getrandom = "0.2"
pulseaudio = "0.3.1"
rquickjs = "0.14"
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
ureq = "3"

[features]
sabotage = []
diagnostics = []

[[bin]]
name = "bramley-musickit"
path = "src/bin/bramley-musickit/main.rs"
required-features = ["sabotage", "diagnostics"]

[build-dependencies]
cc = "1"
